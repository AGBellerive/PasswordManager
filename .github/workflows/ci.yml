name: Python Flask CI

on:
  push:
    branches: [ "server", "main" ]
  pull_request:
    branches: [ "server", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f web_server/requirements.txt ]; then pip install -r web_server/requirements.txt; fi
        pip install pytest

    - name: Run Tests
      run: |
        pytest
